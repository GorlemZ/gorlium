name: app-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gorlium/app test -- src/garment
      - run: pnpm --filter @gorlium/app typecheck
      - run: pnpm --filter @gorlium/app lint
      - run: pnpm --filter @gorlium/app build
